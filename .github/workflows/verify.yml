name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check version format
        run: grep -Ex '[0-9]+\.[0-9]+\.[0-9]+' VERSION
      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
      - name: Scan dependencies
        uses: google/osv-scanner-action@v1.9.2
      - name: Scan licenses
        if: ${{ secrets.FOSSA_API_KEY != '' }}
        uses: fossas/fossa-action@v1.6.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and test Android scaffold
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Check Kotlin formatting
        working-directory: android
        run: gradle --no-daemon :app:ktfmtCheck

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure native target
        run: cmake --preset windows-x64-debug -S windows
      - name: Build native target
        run: cmake --build windows/out/build/windows-x64-debug
      - name: Test configuration parsing
        run: ctest --test-dir windows/out/build/windows-x64-debug --output-on-failure
      - name: Check C++ formatting
        run: clang-format --dry-run --Werror windows/native/src/main.cpp
      - name: Build .NET target
        run: dotnet build windows/CamLink.sln --configuration Release --nologo
      - name: Check .NET formatting
        run: dotnet format windows/CamLink.sln --verify-no-changes --no-restore

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp, csharp, java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v3
